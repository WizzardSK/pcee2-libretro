name: 🤖 ARM64 Core Builds

on:
  push:
    branches:
      - arm64
  workflow_dispatch:

jobs:
  build_android:
    name: "Android arm64-v8a"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure
        run: |
          echo "NDK: $ANDROID_NDK_ROOT"
          cmake -S app/src/main/cpp -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID=true \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_RAINTEGRATION=ON \
            -DENABLE_LIBRETRO=ON

      - name: Build Core
        run: cmake --build build --target pcee2-libretro --parallel

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/bin/pcee2_libretro.so app/src/main/cpp/pcee2-libretro/pcee2_libretro.info artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcee2_libretro-android-arm64
          path: artifact/*
