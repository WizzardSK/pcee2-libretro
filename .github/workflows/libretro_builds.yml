name: 🕹️ Libretro Core Builds

on:
  push:
    branches:
      - libretro
      - libretro-arm64
      - "libretro-arm64-*"
  workflow_dispatch:

jobs:
  build_linux:
    name: "Linux x86_64"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang liblz4-dev libwebp-dev \
            libshaderc-dev libcurl4-openssl-dev libpcap-dev libfontconfig-dev \
            libudev-dev libx11-dev libxrandr-dev libxext-dev extra-cmake-modules \
            libwayland-dev libegl-dev libdbus-1-dev libfreetype-dev libjpeg-turbo8-dev \
            libpng-dev zlib1g-dev libzstd-dev libdrm-dev libxkbcommon-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev libxrender-dev \
            libxss-dev libxtst-dev libgl1-mesa-dev libdecor-0-dev libgbm-dev

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: deps
          key: linux-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-linux.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          PCEE2_SDL_STATIC: "1"
          PCEE2_BUILD_JPEG: "1"
        run: bash pcee2-libretro/scripts/build-deps-linux.sh "$PWD/deps"

      - name: Generate CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DENABLE_LIBRETRO=ON \
            -DCMAKE_PREFIX_PATH="$PWD/deps" \
            -DSHADERC_STATIC=ON \
            "-DSHADERC_LIBRARY=$PWD/deps/lib/libshaderc_combined.a" \
            -DDISABLE_ADVANCE_SIMD=ON

      - name: Build Core
        run: cmake --build build --target pcee2_libretro

      - name: Verify self-contained (no libSDL3 / libjpeg NEEDED)
        run: |
          if readelf -d build/bin/pcee2_libretro.so | grep -qE 'libSDL3|libjpeg'; then
            echo "ERROR: core still links SDL3 or libjpeg dynamically:"
            readelf -d build/bin/pcee2_libretro.so | grep NEEDED
            exit 1
          fi
          echo "OK: SDL3 and libjpeg are statically linked."

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/bin/pcee2_libretro.so pcee2-libretro/pcee2_libretro.info artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-linux-x86_64
          path: artifact/*

  build_linux_arm64:
    name: "Linux aarch64"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang liblz4-dev libwebp-dev \
            libshaderc-dev libcurl4-openssl-dev libpcap-dev libfontconfig-dev \
            libudev-dev libx11-dev libxrandr-dev libxext-dev extra-cmake-modules \
            libwayland-dev libegl-dev libdbus-1-dev libfreetype-dev libjpeg-turbo8-dev \
            libpng-dev zlib1g-dev libzstd-dev libdrm-dev libxkbcommon-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev libxrender-dev \
            libxss-dev libxtst-dev libgl1-mesa-dev libdecor-0-dev libgbm-dev

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: deps
          key: linux-arm64-libretro-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-linux.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash pcee2-libretro/scripts/build-deps-linux.sh "$PWD/deps"

      - name: Generate CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DENABLE_LIBRETRO=ON \
            -DCMAKE_PREFIX_PATH="$PWD/deps" \
            -DSHADERC_STATIC=ON \
            "-DSHADERC_LIBRARY=$PWD/deps/lib/libshaderc_combined.a" \
            -DDISABLE_ADVANCE_SIMD=ON

      - name: Build Core
        run: cmake --build build --target pcee2_libretro

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/bin/pcee2_libretro.so pcee2-libretro/pcee2_libretro.info artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-linux-aarch64
          path: artifact/*

  # Windows the way the libretro buildbot builds it: a MinGW cross-build from
  # Linux, not MSVC. The buildbot's image is MXE (x86_64-w64-mingw32.static);
  # its registry is out of reach from here, so Ubuntu's posix-threads MinGW
  # stands in, behind the same x86_64-w64-mingw32.static-* names and a cmake
  # wrapper carrying a toolchain file, which is what the deps script and the
  # core's configure call there.
  build_windows:
    name: "Windows x64 (MinGW)"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64

      - name: MXE-style Toolchain
        run: |
          tc="$RUNNER_TEMP/mingw"; mkdir -p "$tc/bin"
          for t in gcc g++ c++ cpp; do ln -s "$(command -v x86_64-w64-mingw32-$t-posix)" "$tc/bin/x86_64-w64-mingw32.static-$t"; done
          for t in ar ranlib nm ld strip windres dlltool objcopy objdump; do ln -s "$(command -v x86_64-w64-mingw32-$t)" "$tc/bin/x86_64-w64-mingw32.static-$t"; done
          cat > "$tc/toolchain.cmake" <<'TC'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc-posix)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++-posix)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          # The dependency prefix is a root too, as on the buildbot, so that
          # ONLY-mode finds look in it.
          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32 $ENV{PCEE2_DEPS})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "")
          # MXE's .static toolchain links its runtime statically; so does this.
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-static -static-libgcc -static-libstdc++")
          TC
          cat > "$tc/bin/x86_64-w64-mingw32.static-cmake" <<'WR'
          #!/bin/sh
          case "$1" in
            --build|--install|-E|-P) exec cmake "$@" ;;
            *) exec cmake -DCMAKE_TOOLCHAIN_FILE="$(dirname "$0")/../toolchain.cmake" "$@" ;;
          esac
          WR
          chmod +x "$tc/bin/x86_64-w64-mingw32.static-cmake"
          echo "$tc/bin" >> "$GITHUB_PATH"
          echo "PCEE2_DEPS=$PWD/deps" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: deps
          key: windows-mingw-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-linux.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          CMAKE: x86_64-w64-mingw32.static-cmake
          HOST: x86_64-w64-mingw32.static
          PCEE2_SDL_STATIC: "1"
        run: bash pcee2-libretro/scripts/build-deps-linux.sh "$PWD/deps"

      # CORE_ARGS of the buildbot job (.core-defs), unchanged.
      - name: Generate CMake
        run: |
          x86_64-w64-mingw32.static-cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIBRETRO=ON -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF \
            -DDISABLE_ADVANCE_SIMD=ON -DSHADERC_STATIC=ON \
            -DCMAKE_PREFIX_PATH="$PWD/deps" \
            "-DSHADERC_LIBRARY=$PWD/deps/lib/libshaderc_combined.a" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/deps" \
            . -Bbuild/windows-x86_64

      - name: Build Core
        run: cmake --build build/windows-x86_64 --target pcee2_libretro --config Release

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/windows-x86_64/bin/pcee2_libretro.dll pcee2-libretro/pcee2_libretro.info artifact/
          x86_64-w64-mingw32-strip --strip-unneeded artifact/pcee2_libretro.dll
          x86_64-w64-mingw32-objdump -p artifact/pcee2_libretro.dll | grep "DLL Name"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-windows-x64
          path: artifact/*

  build_macos:
    name: "macOS x86_64"
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 320
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          if ! brew install ninja nasm; then
            brew update
            brew install ninja nasm
          fi

      - name: Restore Dependencies Cache
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          path: ~/deps
          key: macos-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash pcee2-libretro/scripts/build-deps-macos.sh "$HOME/deps"

      # save immediately so a later timeout can't lose the deps build
      - name: Save Dependencies Cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/deps
          key: macos-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Generate CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$HOME/deps" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DDISABLE_ADVANCE_SIMD=ON \
            -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DENABLE_LIBRETRO=ON \
            -DSHADERC_STATIC=ON "-DSHADERC_LIBRARY=$HOME/deps/lib/libshaderc_combined.a"

      - name: Build Core
        run: cmake --build build --target pcee2_libretro --parallel

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/bin/pcee2_libretro.dylib pcee2-libretro/pcee2_libretro.info artifact/
          # runtime-dlopen'd Vulkan driver (found next to the core via DynamicLibrary)
          cp "$HOME"/deps/lib/libMoltenVK.dylib artifact/
          cd artifact

          # The core must be self-contained apart from the dlopen'd libs above;
          # fail loudly if any deps-prefix install names leaked in.
          if otool -L pcee2_libretro.dylib | grep -q "/Users/runner/deps"; then
            echo "ERROR: core still references deps dylibs:" && otool -L pcee2_libretro.dylib
            exit 1
          fi

          for f in *.dylib; do
            codesign -f -s - "$f"
          done
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-macos-x86_64
          path: artifact/*

  build_macos_arm64:
    name: "macOS arm64"
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 320
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          if ! brew install ninja nasm; then
            brew update
            brew install ninja nasm
          fi

      - name: Restore Dependencies Cache
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          path: ~/deps
          key: macos-arm64-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: OSX_ARCH=arm64 bash pcee2-libretro/scripts/build-deps-macos.sh "$HOME/deps"

      # save immediately so a later timeout can't lose the deps build
      - name: Save Dependencies Cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/deps
          key: macos-arm64-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Generate CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$HOME/deps" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DDISABLE_ADVANCE_SIMD=ON -DLTO_PCSX2_CORE=ON \
            -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DENABLE_LIBRETRO=ON \
            -DSHADERC_STATIC=ON "-DSHADERC_LIBRARY=$HOME/deps/lib/libshaderc_combined.a"

      - name: Build Core
        run: cmake --build build --target pcee2_libretro --parallel

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/bin/pcee2_libretro.dylib pcee2-libretro/pcee2_libretro.info artifact/
          # runtime-dlopen'd Vulkan driver (found next to the core via DynamicLibrary)
          cp "$HOME"/deps/lib/libMoltenVK.dylib artifact/
          cd artifact

          # The core must be self-contained apart from the dlopen'd libs above;
          # fail loudly if any deps-prefix install names leaked in.
          if otool -L pcee2_libretro.dylib | grep -q "/Users/runner/deps"; then
            echo "ERROR: core still references deps dylibs:" && otool -L pcee2_libretro.dylib
            exit 1
          fi

          for f in *.dylib; do
            codesign -f -s - "$f"
          done
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-macos-arm64
          path: artifact/*

  # iOS, as the buildbot's ios-cmake template builds it: a cross-build on
  # the Apple Silicon runner with the Vulkan renderer off (Metal only).
  build_ios:
    name: "iOS arm64"
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 320
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          if ! brew install ninja nasm; then
            brew update
            brew install ninja nasm
          fi

      - name: Restore Dependencies Cache
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          path: ~/deps
          key: ios-arm64-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: APPLE_PLATFORM=ios OSX_ARCH=arm64 bash pcee2-libretro/scripts/build-deps-macos.sh "$HOME/deps"

      - name: Save Dependencies Cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/deps
          key: ios-arm64-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Generate CMake
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS=-DIOS -DCMAKE_CXX_FLAGS=-DIOS -DIOS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="8.0" -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_LIBRETRO=ON -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF \
            -DDISABLE_ADVANCE_SIMD=ON -DSHADERC_STATIC=ON -DUSE_VULKAN=OFF \
            -DCMAKE_PREFIX_PATH="$HOME/deps" \
            "-DSHADERC_LIBRARY=$HOME/deps/lib/libshaderc_combined.a" \
            -DCMAKE_FIND_ROOT_PATH="$HOME/deps" -DCMAKE_MACOSX_BUNDLE=OFF \
            . -Bbuild/ios-arm64

      - name: Build Core
        run: cmake --build build/ios-arm64 --target pcee2_libretro --config RelWithDebInfo

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/ios-arm64/bin/pcee2_libretro.dylib pcee2-libretro/pcee2_libretro.info artifact/
          strip -S artifact/pcee2_libretro.dylib
          otool -L artifact/pcee2_libretro.dylib
          vtool -show artifact/pcee2_libretro.dylib || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-ios-arm64
          path: artifact/*

  # tvOS, as the buildbot's tvos-cmake template builds it: a cross-build on
  # the Apple Silicon runner with the Vulkan renderer off (Metal only).
  build_tvos:
    name: "tvOS arm64"
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 320
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Packages
        run: |
          if ! brew install ninja nasm; then
            brew update
            brew install ninja nasm
          fi

      - name: Restore Dependencies Cache
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          path: ~/deps
          key: tvos-arm64-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: APPLE_PLATFORM=tvos OSX_ARCH=arm64 bash pcee2-libretro/scripts/build-deps-macos.sh "$HOME/deps"

      - name: Save Dependencies Cache
        if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/deps
          key: tvos-arm64-libretro-static-deps ${{ hashFiles('pcee2-libretro/scripts/build-deps-macos.sh', 'pcee2-libretro/scripts/deps.versions') }}

      - name: Generate CMake
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS=-DIOS -DCMAKE_CXX_FLAGS=-DIOS -DIOS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="12.0" -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_LIBRETRO=ON -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF \
            -DDISABLE_ADVANCE_SIMD=ON -DSHADERC_STATIC=ON -DUSE_VULKAN=OFF \
            -DCMAKE_PREFIX_PATH="$HOME/deps" \
            "-DSHADERC_LIBRARY=$HOME/deps/lib/libshaderc_combined.a" \
            -DCMAKE_FIND_ROOT_PATH="$HOME/deps" -DCMAKE_MACOSX_BUNDLE=OFF \
            . -Bbuild/tvos-arm64

      - name: Build Core
        run: cmake --build build/tvos-arm64 --target pcee2_libretro --config RelWithDebInfo

      - name: Prepare Artifact
        run: |
          mkdir artifact
          cp build/tvos-arm64/bin/pcee2_libretro.dylib pcee2-libretro/pcee2_libretro.info artifact/
          strip -S artifact/pcee2_libretro.dylib
          otool -L artifact/pcee2_libretro.dylib
          vtool -show artifact/pcee2_libretro.dylib || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-tvos-arm64
          path: artifact/*
